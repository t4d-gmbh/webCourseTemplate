# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    # Runs on pushes targeting the default branch
    branches: ["main", ]
    # Runs when a new tag is pushed to the remote
    tags:
      - "*"
      #
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip' # caching pip dependencies
      - run: pip install -r requirements.txt
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Test deployment configuration preparation
        run: python -m unittest discover -s tests -p test_pages_config.py
      - name: Prepare deployment configuration
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python .github/scripts/prepare_pages_config.py
      - name: Spinx build pages
        run: |
            sphinx-build -b html source docs/html -E -A build="pages"
      - name: Spinx build slides
        run: |
            sphinx-build -b html source docs/html/slides -E -A build="slides"
      - name: Check generated page and slide navigation
        run: python -m unittest discover -s tests -p test_pages_navigation.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'docs/html'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
